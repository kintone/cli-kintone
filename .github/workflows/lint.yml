name: lint

on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
      id-token: write # Required for Takumi Guard bot authentication (OIDC)
    runs-on: ubuntu-latest
    steps:
      - uses: Kesin11/actions-timeline@54d513e0b5ff1158f1cf8321108d666a5a6c1fca # v2

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{ !github.event.pull_request.head.repo.fork && secrets.TAKUMI_GUARD_BOT_ID || '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
