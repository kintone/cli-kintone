name: test-executables
on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:

jobs:
  build-executables:
    name: Build executables
    permissions:
      contents: read
      id-token: write # Required for Takumi Guard bot authentication (OIDC)
    # ubuntu上でビルドしたmacOS向けの実行ファイルが正常に動作しないため、
    # macOSランナー上でビルドする
    # ref. https://github.com/yao-pkg/pkg/issues/183
    runs-on: macos-latest
    steps:
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{ !github.event.pull_request.head.repo.fork && secrets.TAKUMI_GUARD_BOT_ID || '' }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:executables
      - run: jq -r '.version' ./package.json > bin/EXPECTED_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: executables
          path: bin/*
          retention-days: 1day

  test-executables:
    name: Test executables - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-executables

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: executables
      - run: chmod +x ./cli-kintone-*
      - run: ./cli-kintone-linux-x64 --version | tee ACTUAL_VERSION
        if: ${{ matrix.os == 'ubuntu-latest' }}
      - run: ./cli-kintone-win-x64.exe --version | tee ACTUAL_VERSION
        if: ${{ matrix.os == 'windows-latest' }}
      - run: ./cli-kintone-macos-arm64 --version | tee ACTUAL_VERSION
        if: ${{ matrix.os == 'macos-latest' }}
      - run: diff EXPECTED_VERSION ACTUAL_VERSION
