name: test-npm

on:
  push:
    branches:
      - main
      - "renovate/**"
  pull_request:

jobs:
  prepare:
    name: Prepare npm package
    permissions:
      contents: read
      id-token: write # Required for Takumi Guard bot authentication (OIDC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
        with:
          bot-id: ${{ !github.event.pull_request.head.repo.fork && secrets.TAKUMI_GUARD_BOT_ID || '' }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm pack
      - run: mv kintone-cli-*.tgz kintone-cli.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: kintone-cli.tgz
          path: kintone-cli.tgz

  test-install:
    name: Test npm install - Node.js ${{ matrix.os }} ${{ matrix.node-version }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: kintone-cli.tgz
      - run: npm install -g kintone-cli.tgz
      - run: cli-kintone --version

  test-npx:
    name: Test npx - Node.js ${{ matrix.os }} ${{ matrix.node-version }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: kintone-cli.tgz
      - run: npx kintone-cli.tgz --version
