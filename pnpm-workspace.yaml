packages:
  - "website"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Renovate security update: tar@7.5.7 || 7.5.8 || 7.5.10 || 7.5.11
  - tar@7.5.7 || 7.5.8 || 7.5.10 || 7.5.11
  # Renovate security update: ajv@8.18.0
  - ajv@8.18.0
  # Renovate security update: yauzl@3.2.1
  - yauzl@3.2.1
  # First-party package for permissions restructure
  - "@kintone/plugin-manifest-validator@11.3.0"
  # Renovate security update: ws@8.21.0
  - ws@8.21.0
  # First-party package
  - "@kintone/rest-api-client@6.2.1"

overrides:
  braces: ">=3.0.3"
  browserslist: ">=4.28.7 <5"
  # Upper bound keeps undici on the v7 line, which @yao-pkg/pkg-fetch@3.6.5
  # declares (`^7.28.0`). Drop `<8` once every consumer supports v8.
  undici: ">=7.29.1 <8"
  ws: ">=8.21.3"
  brace-expansion@^1: ">=1.1.20 <2"
  brace-expansion@^2: ">=2.1.6 <3"
  brace-expansion@^5: ">=5.0.11 <6"
  js-yaml@^4: ">=4.3.2"
  shell-quote: ">=1.9.0"
  websocket-driver: ">=0.7.5"
  # ajv still declares `fast-uri: ^3.0.1` as of 8.20.0, so v4 is only reached
  # through this override. Keep the upper bound so the next major is not picked
  # up unnoticed; drop it once ajv declares v4 or later.
  fast-uri: ">=4.1.4 <5"
  immutable: ">=5.1.9"
  # Upper bound keeps svgo on the v3 line, which both consumers declare:
  # @svgr/plugin-svgo@8.1.0 and postcss-svgo@6.0.3 depend on `svgo: ^3`.
  # Drop `<4` once they support v4, or if the v3 line stops receiving backports.
  svgo: ">=3.3.5 <4"
